name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'members.json'
      - 'scripts/build.js'
      - 'assets/**'
      - 'img/**'
      - 'tale-of-bap.html'
      - 'CNAME'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test worker/test.mjs
      - run: node scripts/build.js
      - uses: actions/configure-pages@v5
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html tale-of-bap.html CNAME _site/
          cp -R img assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
